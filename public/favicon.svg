<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Background -->
  <rect width="100" height="100" rx="20" fill="#070714"/>
  
  <!-- React Atom (centered & scaled) -->
  <g transform="translate(50, 50) scale(2.2)" fill="#2dd4bf">
    <!-- Center Dot -->
    <circle r="2.05" fill="#2dd4bf"/>
    
    <!-- 3 Orbits -->
    <g stroke="#2dd4bf" stroke-width="0.8" fill="none">
      <ellipse rx="11" ry="4.2"/>
      <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
      <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
    </g>
  </g>
</svg>